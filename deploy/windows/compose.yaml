name: 400c
services:
  chem-platform:
    image: chem-platform:latest
    ports:
      - "8080:8080"
    environment:
      HTTPD_URI: ":8080"
      MQTT_BROKER: "tcp://mqtt:1883"
      TILE_SERVER_URL: "http://mapserver:8080"
      DATABASE_URI: "mongodb://mongo:27017"
    depends_on:
      mongo:
        condition: service_healthy
      mqtt:
        condition: service_started
      mapserver:
        condition: service_started
    restart: unless-stopped
  mapserver:
    image: it.enboso.com:8080/wm/tileserver-gl:latest
    command: ["--file", "fuzhou.mbtiles", "--port", "8080"]
    volumes:
      - ./data/tileserver:/data:ro
    restart: unless-stopped
  mongo:
    image: mongo:8.0
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped
  mqtt:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./data/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mqtt-data:/mosquitto/data
      - mqtt-log:/mosquitto/log
    restart: unless-stopped
volumes:
  mongo-data:
  mqtt-data:
  mqtt-log:

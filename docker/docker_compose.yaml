services:
  chem-platform:
    image: chem-platform:latest
    container_name: chem-platform
    ports:
      - "8080:8080"
    environment:
      HTTPD_URI: ":8080"
      MQTT_BROKER: "tcp://mqtt:1883"
      TILE_SERVER_URL: "http://mapserver:8080"
      DATABASE_URI: "mongodb://host.docker.internal:27017"
    depends_on:
      - mapserver
      - mqtt
    restart: unless-stopped
    networks:
      - internal-network

  mapserver:
    image: it.enboso.com:8080/wm/tileserver-gl:latest
    container_name: tileserver
    volumes:
      - ./data/tileserver:/data:ro
    command: [ "--file", "fuzhou.mbtiles", "--port", "8080", "--verbose" ]
    restart: unless-stopped
    networks:
      - internal-network

  mqtt:
    image: eclipse-mosquitto:2
    container_name: chem-mqtt
    ports:
      - 1883:1883
      - 9001:9001
    volumes:
      - ./data/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mqtt-data:/mosquitto/data
      - mqtt-log:/mosquitto/log
    networks:
      - internal-network

volumes:
  mqtt-data:
  mqtt-log:

networks:
  internal-network:
    external: true
    name: internal-br

services:
  chem-platform:
    image: chem-platform:latest
    container_name: chem-platform
    ports:
      - "8080:8080"
    environment:
      HTTPD_URI: ":8080"
      MQTT_BROKER: "tcp://mqtt:1883"
      TILE_SERVER_URL: "http://mapserver:8080"
      DATABASE_URI: "mongodb://mongo:27017"
    depends_on:
      mapserver:
        condition: service_started
      mqtt:
        condition: service_started
      mongo:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - internal-network

  mapserver:
    image: it.enboso.com:8080/wm/tileserver-gl:latest
    container_name: tileserver
    volumes:
      - ./data/tileserver:/data:ro
    command: [ "--file", "fuzhou.mbtiles", "--port", "8080", "--verbose" ]
    restart: unless-stopped
    networks:
      - internal-network

  mongo:
    image: mongo:8.0
    container_name: chem-mongodb
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - internal-network

  mqtt:
    image: eclipse-mosquitto:2
    container_name: chem-mqtt
    ports:
      - 1883:1883
      - 9001:9001
    volumes:
      - ./data/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mqtt-data:/mosquitto/data
      - mqtt-log:/mosquitto/log
    networks:
      - internal-network

volumes:
  mqtt-data:
  mqtt-log:
  mongo-data:

networks:
  internal-network:
    external: true
    name: internal-br
